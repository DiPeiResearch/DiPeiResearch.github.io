# Site identity
locale: "en-US"
site_theme: "default"
title: "Di Pei"
title_separator: "|"
name: &name "Di Pei, Ph.D."
description: &description "Di Pei is a public health and health communication researcher who studies how messages can advance tobacco control and health equity."


url: "https://DiPeiResearch.github.io"
baseurl: ""
repository: "DiPeiResearch/GITHUB_DiPeiResearch.github.io"

author:
  avatar: "di-pei-portrait.png"
  name: "Di Pei, Ph.D."
  bio: "Public health and health communication researcher focused on tobacco control, health equity, and message science."
  location: "Atlanta, Georgia"
  employer: "Georgia State University"
  uri: "https://publichealth.gsu.edu/profile/di-pei/"
  email: "dpei@gsu.edu"
  orcid: "https://orcid.org/0000-0002-8780-185X"
  pubmed: "https://pubmed.ncbi.nlm.nih.gov/?term=Di+Pei%5BAuthor%5D"
  github: # Set to DiPeiResearch when the account is available.

publication_category:
  manuscripts:
    title: "Peer-reviewed publications"

teaser: "di-pei-portrait.png"
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: true

analytics:
  provider: false

social:
  type: Person
  name: "Di Pei"
  links:
    - "https://publichealth.gsu.edu/profile/di-pei/"
    - "https://orcid.org/0000-0002-8780-185X"

og_image: "di-pei-portrait.png"
og_description: *description

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  publications:
    output: true
    permalink: /publications/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/New_York

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
